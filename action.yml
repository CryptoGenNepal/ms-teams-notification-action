name: 'MS Teams Notification Action'
description: 'Send a notification to Microsoft Teams'
inputs:
  webhook_url:
    description: 'Microsoft Teams webhook URL'
    required: true
  title:
    description: 'Notification title'
    required: true
  url:
    description: 'URL to link in the notification'
    required: false
    default: ''
  theme_color:
    description: 'Theme color for the Teams message card'
    required: false
    default: 'ff0000'
  additional_facts:
    description: 'JSON of key-value fields to include in the notification'
    required: false
    default: '[]'
runs:
  using: 'composite'
  steps:
    - name: Send Teams Notification
      shell: bash
      env:
        TEAMS_WEBHOOK_URL: ${{ inputs.webhook_url }}
        TITLE: ${{ inputs.title }}
        URL: ${{ inputs.url }}
        THEME_COLOR: ${{ inputs.theme_color }}
        ADDITIONAL_FACTS: ${{ inputs.additional_facts }}
      run: |
        if [ -z "$TEAMS_WEBHOOK_URL" ]; then
          echo "Error: webhook_url is empty."
          exit 1
        fi

        if [ -z "$TITLE" ]; then
          echo "Error: title is empty."
          exit 1
        fi

        # Set default values for optional inputs
        THEME="${THEME_COLOR:-ff0000}"

        # Escape special characters in variables
        escape_string() {
          echo "$1" | sed 's/\\/\\\\/g; s/"/\\"/g; s/`/\\`/g; s/\$/\\$/g'
        }

        TITLE_ESCAPED=$(escape_string "$TITLE")
        URL_ESCAPED=$(escape_string "$URL")

        ACTIVITY_TITLE="$TITLE_ESCAPED"
        BUTTON_TEXT="View"


        FACTS="${ADDITIONAL_FACTS:-[]}"
        if ! printf '%s' "$FACTS" | jq -e 'type == "array"' >/dev/null 2>&1; then
          echo "Error: additional_facts must be a valid JSON array."
          exit 1
        fi

        # Build the actions array conditionally
        ACTIONS=""
        if [ -n "$URL" ]; then
          ACTIONS=", \"potentialAction\": [{
            \"@type\": \"OpenUri\",
            \"name\": \"$BUTTON_TEXT\",
            \"targets\": [{
              \"os\": \"default\",
              \"uri\": \"$URL_ESCAPED\"
            }]
          }]"
        fi

        # Send the notification
        PAYLOAD=$(cat <<EOF
        {
          "@type": "MessageCard",
          "@context": "http://schema.org/extensions",
          "themeColor": "$THEME",
          "summary": "$TITLE_ESCAPED",
          "sections": [{
            "activityTitle": "$ACTIVITY_TITLE",
            "facts": $FACTS,
            "markdown": true
          }]$ACTIONS
        }
        EOF
        )
        curl -H "Content-Type: application/json" -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"

        if [ $? -ne 0 ]; then
          echo "Failed to send notification to Microsoft Teams."
          exit 1
        else
          echo "Notification sent successfully to Microsoft Teams."
        fi
